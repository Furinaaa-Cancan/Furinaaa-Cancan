name: Profile cards

# Generates both layouts from the same GitHub calendar data, without external
# card services or third-party renderers. Failed API calls leave published files intact.

on:
  schedule:
    - cron: "17 16 * * *" # daily, 00:17 Beijing time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-cards.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check contribution calculations
        run: node --test scripts/profile-card.test.mjs

      - name: Render panels and daily statistics snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/profile-card.mjs

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity.svg profile/activity-mobile.svg profile/daily-summary.json
          git diff --cached --quiet && exit 0
          summary_date=$(node -p "JSON.parse(require('node:fs').readFileSync('profile/daily-summary.json', 'utf8')).date")
          git commit -m "chore(profile): daily stats ${summary_date}"
          git pull --rebase
          git push
