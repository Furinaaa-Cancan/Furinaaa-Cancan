name: Profile cards

# Renders the README stats, streak and activity cards inside Actions and commits
# them to profile/, so the README no longer depends on public hosted endpoints.
# A card that fails to render keeps its previous version.

on:
  schedule:
    - cron: "17 16 * * *" # daily, 00:17 Beijing time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare output directory
        run: mkdir -p .cards-tmp

      - name: Stats card
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: "username=Furinaaa-Cancan&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&bg_color=1F1815&title_color=E8B4A0&icon_color=E8B4A0&text_color=F5E6D8&ring_color=C9826F"
          path: .cards-tmp/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Streak card
        continue-on-error: true
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1 # v1.8.0
        with:
          options: "user=Furinaaa-Cancan&hide_border=true&background=1F1815&stroke=C9826F&ring=E8B4A0&fire=C9826F&currStreakNum=F5E6D8&sideNums=F5E6D8&currStreakLabel=E8B4A0&sideLabels=E8B4A0&dates=A89080"
          path: .cards-tmp/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out activity graph renderer
        uses: actions/checkout@v4
        with:
          repository: Ashutosh00710/github-readme-activity-graph
          ref: 0962e9461de815933d462e8b98c7ce566cada8fb
          path: .activity-graph
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activity graph
        continue-on-error: true
        working-directory: .activity-graph
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORT: "5100"
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node "$(find dist -name main.js | head -1)" > server.log 2>&1 &
          for i in $(seq 30); do curl -sf http://localhost:5100/ > /dev/null && break; sleep 1; done
          curl -sf -o ../.cards-tmp/activity.svg \
            "http://localhost:5100/graph?username=Furinaaa-Cancan&hide_border=true&bg_color=1F1815&color=F5E6D8&line=E8B4A0&point=C9826F&area=true&area_color=E8B4A0&custom_title=Contribution%20Activity%20%C2%B7%20%E8%B4%A1%E7%8C%AE%E8%B6%8B%E5%8A%BF"

      - name: Keep valid cards
        run: |
          mkdir -p profile
          for card in stats streak activity; do
            src=".cards-tmp/$card.svg"
            if [ -s "$src" ] && grep -q "<svg" "$src" \
              && ! grep -qiE "something went wrong|something unexpected happened" "$src"; then
              cp "$src" "profile/$card.svg"
              echo "updated $card"
            else
              echo "::warning::$card card was not generated; keeping the previous version"
            fi
          done

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update profile cards"
          git pull --rebase
          git push
